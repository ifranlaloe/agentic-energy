<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e60167" />
    <title>Everyday Calculator | TypeScript Lab</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="page">
      <div class="intro">
        <p class="eyebrow">TypeScript lab / 01</p>
        <h1>Make the numbers <em>work.</em></h1>
        <p>A little calculator built with plain TypeScript. No framework, just code you can change.</p>
      </div>

      <section class="calculator" aria-label="Calculator">
        <header class="calculator-header">
          <span class="brand"><span class="brand-mark" aria-hidden="true">✳</span> everyday<span class="brand-muted">.calc</span></span>
          <span class="live-badge"><span aria-hidden="true"></span> Live preview</span>
        </header>

        <div class="screen">
          <p id="expression" class="expression" aria-hidden="true">&nbsp;</p>
          <output id="display" class="display" aria-label="Result" aria-live="polite" aria-atomic="true">0</output>
        </div>

        <div id="keypad" class="keypad" role="group" aria-label="Calculator keys">
          <button type="button" class="key key--utility" data-key="clear" aria-label="Clear all">AC</button>
          <button type="button" class="key key--utility" data-key="sign" aria-label="Change sign">+/−</button>
          <button type="button" class="key key--utility" data-key="percent" aria-label="Percent">%</button>
          <button type="button" class="key key--operator" data-key="÷" aria-label="Divide">÷</button>

          <button type="button" class="key" data-key="7">7</button>
          <button type="button" class="key" data-key="8">8</button>
          <button type="button" class="key" data-key="9">9</button>
          <button type="button" class="key key--operator" data-key="×" aria-label="Multiply">×</button>

          <button type="button" class="key" data-key="4">4</button>
          <button type="button" class="key" data-key="5">5</button>
          <button type="button" class="key" data-key="6">6</button>
          <button type="button" class="key key--operator" data-key="−" aria-label="Subtract">−</button>

          <button type="button" class="key" data-key="1">1</button>
          <button type="button" class="key" data-key="2">2</button>
          <button type="button" class="key" data-key="3">3</button>
          <button type="button" class="key key--operator" data-key="+" aria-label="Add">+</button>

          <button type="button" class="key key--back" data-key="backspace" aria-label="Delete last digit">⌫</button>
          <button type="button" class="key" data-key="0">0</button>
          <button type="button" class="key" data-key="." aria-label="Decimal point">.</button>
          <button type="button" class="key key--equals" data-key="=" aria-label="Equals">=</button>
        </div>
        <p id="message" class="message" role="status">Keyboard friendly: numbers, operators, Enter and Backspace.</p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
